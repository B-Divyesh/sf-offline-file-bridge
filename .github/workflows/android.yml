name: Build Android release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/factory-test.keystore
      ANDROID_KEYSTORE_PASSWORD: android
      ANDROID_KEY_ALIAS: factory-test
      ANDROID_KEY_PASSWORD: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - name: Install web dependencies
        run: npm ci
      - name: Read and verify the tagged release candidate
        shell: bash
        run: |
          RELEASE_COMMIT="$(git rev-parse "${GITHUB_REF_NAME}^{commit}")"
          printf 'RELEASE_COMMIT=%s\n' "$RELEASE_COMMIT" >> "$GITHUB_ENV"
          node scripts/release-contract.mjs candidate "$GITHUB_REF_NAME" "$RELEASE_COMMIT"
      - name: Build and sync the PWA
        run: BUILD_COMMIT="$RELEASE_COMMIT" npm run build && npx cap sync android
      - name: Create the test signing key
        run: >-
          keytool -genkeypair -v -keystore "$ANDROID_KEYSTORE_PATH"
          -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS"
          -keypass "$ANDROID_KEY_PASSWORD" -keyalg RSA -keysize 2048
          -validity 10000 -dname "CN=Param Factory Test, O=Sociobot, C=IN"
      - name: Run installed-APK Android instrumentation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          script: >-
            sh scripts/wait-for-android.sh &&
            npm run test:android-claim -- scoped-folder-access &&
            npm run test:android-claim -- native-refresh-safety &&
            npm run test:android-claim -- consent-removal &&
            npm run test:android-claim -- native-handoff
      - name: Build the APK and app bundle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew test
          ./gradlew assembleRelease bundleRelease
      - name: Prepare release files
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p release
          cp android/app/build/outputs/apk/release/app-release.apk "release/offline-file-bridge-v${VERSION}.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "release/offline-file-bridge-v${VERSION}.aab"
          node scripts/release-contract.mjs artifact "release/offline-file-bridge-v${VERSION}.apk" "$GITHUB_REF_NAME" "$RELEASE_COMMIT" "release/BUILD-PROVENANCE.json"
          node scripts/release-contract.mjs notes "release/BUILD-PROVENANCE.json" "release/RELEASE-NOTES.md"
          cd release
          sha256sum "offline-file-bridge-v${VERSION}.apk" "offline-file-bridge-v${VERSION}.aab" BUILD-PROVENANCE.json > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Offline File Bridge ${{ github.ref_name }}
          body_path: release/RELEASE-NOTES.md
          files: |
            release/*.apk
            release/*.aab
            release/BUILD-PROVENANCE.json
            release/SHA256SUMS
